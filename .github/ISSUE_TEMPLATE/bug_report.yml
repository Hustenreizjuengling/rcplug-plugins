name: Bug report
description: A plugin does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never paste passwords, Wi-Fi keys or the device's serial number.
  - type: input
    id: plugin
    attributes:
      label: Plugin and version
      placeholder: sonar 0.5.0
    validations:
      required: true
  - type: input
    id: rcplug
    attributes:
      label: rcplug version, device and firmware
      placeholder: rcplug 0.5.0, RØDECaster Duo, firmware 1.7.6
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The plugin's log from the dashboard's Plugins page.
      render: text
