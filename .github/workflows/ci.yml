name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The plugins are built against rcplug's SDK from its main branch (a checkout
# next to this one), which GitHub allows only while rcplug is public; until
# then only the documentation job runs. Everything is built with the current
# Go release, as the release files are; the "minimum Go" job keeps the go.mod
# version working.
jobs:
  docs:
    name: Docs and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make docs-check
      - run: shellcheck tools/release-version.sh

  test:
    name: Go tests (with rcplug's SDK from main)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rcplug-plugins
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/rcplug
          path: rcplug
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go work init ./rcplug-plugins ./rcplug
      - run: make -C rcplug-plugins check package
      - name: arm64 tests (qemu-user)
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user
          make -C rcplug-plugins test-arm64

  minimum-go:
    name: Tests with the minimum Go version (go.mod)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rcplug-plugins
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/rcplug
          path: rcplug
      - uses: actions/setup-go@v5
        with:
          go-version-file: rcplug-plugins/go.mod
      - run: go work init ./rcplug-plugins ./rcplug
      - run: cd rcplug-plugins && go vet ./... && go test ./...
