name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: make test package
      # release.json lists every package with its SHA-256; rcplugd checks the
      # signature over it before it offers or installs a plugin update. The
      # verify step fails unless the key is one rcplugd trusts.
      - name: Sign the release
        env:
          RCPLUG_SIGNING_KEY: ${{ secrets.RCPLUG_SIGNING_KEY }}
        run: |
          if [ -z "$RCPLUG_SIGNING_KEY" ]; then echo "::error::the repository secret RCPLUG_SIGNING_KEY is not set"; exit 1; fi
          make sign
          go run github.com/Hustenreizjuengling/rcplug/cmd/rcplug-release verify dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="$(cat VERSION)" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} /^## / && p {exit} p' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "rcplug-plugins $GITHUB_REF_NAME" --notes "$notes" \
            dist/*-aarch64.tar.gz dist/SHA256SUMS dist/release.json dist/release.json.sig
