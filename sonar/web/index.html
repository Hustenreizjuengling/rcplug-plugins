<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonar · rcplug</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22none%22 stroke=%22%2319c37d%22 stroke-width=%222%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222%22 fill=%22%2319c37d%22/%3E%3C/svg%3E">
<style>
  /* Same palette and components as the console, so the plugins look like one app. */
  :root{
    --bg:#0d1015; --panel:#151a21; --panel2:#1c232c; --panel3:#232c37; --line:#2a333f;
    --fg:#e7edf3; --muted:#9aa8b6; --dim:#7d8a97; --accent:#19c37d; --accent-ink:#04261a;
    --amber:#e3a008; --red:#f85149; --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input,select{font:inherit;color:inherit}
  .top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{font-size:22px;color:var(--accent)}
  .dev{font-weight:650;font-size:16px}
  .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  main{padding:16px;max-width:1400px;margin:0 auto}
  .layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:12px;align-items:start}
  .side{display:grid;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
  .scope{position:relative;width:100%;aspect-ratio:2/1.15;background:#10151b;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .scope.stale canvas{opacity:.35}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .readouts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
  .note{font-size:12px;color:var(--muted);margin:8px 2px 0}
  .cal{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .ro{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
  .ro .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
  .ro .k{font-size:11px;color:var(--muted)}
  .meters{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
  .hbar{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden}
  .hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent) 70%,var(--amber) 88%,var(--red));transform-origin:left;transform:scaleX(0)}
  .ctlrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;margin:8px 0}
  .ctlrow label{grid-column:1/-1;color:var(--muted);font-size:13px}
  .val{font-family:var(--mono);font-size:12px;min-width:56px;text-align:right}
  select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row select{flex:1 1 160px;width:auto;min-width:0}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:12px}
  .sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0;--p:0%}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p),var(--panel3) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#e7edf3;border:2px solid var(--accent)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--panel3)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#e7edf3;border:2px solid var(--accent)}
  .muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:var(--mono);font-size:12px}
  .banner{border:1px solid var(--amber);background:#2a2110;color:#ffe2a3;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
  .banner.bad{border-color:var(--red);background:#2a1414;color:#ffb3ae}
  .tag{font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .tag.on{border-color:var(--accent);color:var(--accent)}
  [hidden]{display:none !important}
  body.embedded .top{padding:6px 14px;background:var(--panel2)}
  body.embedded #lang{display:none}
  @media (max-width:860px){ .layout{grid-template-columns:1fr} main{padding:10px} }
  @media (max-width:640px){ .readouts{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>
</head>
<body>
<header class="top">
  <span class="logo" aria-hidden="true">◉</span>
  <div><div class="dev">Sonar</div><div class="sub" id="subline" aria-live="polite"></div></div>
  <span class="spacer"></span>
  <span class="tag" id="state"></span>
  <button type="button" class="btn" id="lang"></button>
</header>
<main>
  <div id="err" class="banner bad" role="alert" hidden></div>
  <div class="layout">
    <section class="card">
      <div class="scope" id="scope"><canvas id="cv" role="img"></canvas></div>
      <div class="readouts">
        <div class="ro"><div class="v" id="azV">0°</div><div class="k" data-t="bearing"></div></div>
        <div class="ro"><div class="v" id="dirV">—</div><div class="k" data-t="side"></div></div>
        <div class="ro"><div class="v" id="distV">—</div><div class="k" data-t="distance"></div></div>
        <div class="ro"><div class="v" id="lvlV">-∞</div><div class="k" data-t="level"></div></div>
        <div class="ro"><div class="v" id="confV">0%</div><div class="k" data-t="confidence"></div></div>
      </div>
      <p class="note" data-t="radarNote"></p>
      <div class="meters" aria-hidden="true">
        <span>L</span><div class="hbar"><i id="mL"></i></div>
        <span>R</span><div class="hbar"><i id="mR"></i></div>
      </div>
    </section>
    <div class="side">
      <section class="card" id="chanCard">
        <h3 id="listenTitle" data-t="listensTo"></h3>
        <div class="row"><select id="listen" aria-labelledby="listenTitle" style="flex:1;min-width:0"></select><button type="button" class="btn" id="refreshSrc" data-t-title="refresh">⟳</button></div>
        <div class="banner" id="listenNote" hidden></div>
        <p class="muted small" id="listenInfo"></p>
      </section>
      <section class="card">
        <h3 data-t="calTitle"></h3>
        <p class="muted small" data-t="calHint"></p>
        <div class="cal"><button type="button" class="btn" id="calNear" data-t="calNear"></button><button type="button" class="btn" id="calFar" data-t="calFar"></button>
          <button type="button" class="btn link" id="calReset" data-t="calReset"></button></div>
        <p class="small" id="calState"></p>
      </section>
      <section class="card">
        <h3 data-t="settings"></h3>
        <div class="ctlrow"><label for="smoothing" data-t="smoothing"></label><input type="range" id="smoothing" min="0" max="0.95" step="0.05"><span class="val" id="smoothingV"></span></div>
        <div class="ctlrow"><label for="noise" data-t="noise"></label><input type="range" id="noise" min="-80" max="-20" step="1"><span class="val" id="noiseV"></span></div>
        <label class="sw"><input type="checkbox" id="flip"> <span data-t="flip"></span></label>
      </section>
    </div>
  </div>
</main>
<script>
'use strict';
const T = {
  en: {
    bearing: 'Bearing', side: 'Side', level: 'Level dBFS', confidence: 'Confidence',
    listensTo: 'What Sonar hears', distance: 'Distance', near: 'near', mid: 'middle', far2: 'far',
    radarNote: 'A stereo signal shows left and right only: front and back sound the same to it, and it has no height. The distance is an estimate from the level and the room’s reverberation; calibrate it for this room.',
    grpIn: 'Inputs of the desk', grpOut: 'Outputs of the mixer', grpOther: 'Other audio',
    sMic12: 'Mic 1 + Mic 2', sMic23: 'Mic 2 + Mic 3', sIn34: 'Inputs 3 + 4', sUsb1: 'USB 1 from the computer', sUsb2: 'USB 2 from the computer', sChat: 'Chat',
    sCall: 'Call {n}', sWireless: 'RØDE wireless', sToUsb1: 'Mix to the computer (USB 1)', sToChat: 'Chat to the computer', sToUsb2: 'USB 2 to the computer',
    sMixOut: 'Mixer output {a} + {b}', sTest: 'Test signal (moves left ↔ right)',
    noteMono: '“{ch}” is one microphone, which has no direction: Sonar listens to {src}.',
    noteUnknown: 'Sonar does not know where “{ch}” comes in: choose above what it should hear.',
    noteTaps: 'The desk’s audio reaches Sonar through rcplug’s audio taps, which are switched off.', tapsLink: 'Switch them on',
    calTitle: 'Calibrate the distance', calHint: 'Speak or clap for a few seconds close to the microphones and press “Near”, then from the far end of the room and press “Far”.',
    calNear: 'Near', calFar: 'Far', calReset: 'Reset', calNone: 'Not calibrated: a rough estimate.', calOnlyNear: 'Near is set; now far.', calOnlyFar: 'Far is set; now near.',
    calDone: 'Calibrated (near {n} dBFS, far {f} dBFS).', calSame: 'Near was not louder than far: calibrate again.', noSignal: 'No sound in the last seconds: speak or clap while calibrating.',
    settings: 'Settings', refresh: 'Reload the source list', smoothing: 'Smoothing', noise: 'Noise floor', flip: 'Swap left/right',
    connecting: 'connecting…', reconnecting: 'reconnecting…', live: 'live', noData: 'no data', failed: 'Could not apply the setting: {err}',
    centre: 'CENTRE', far: 'FAR {s}', slight: 'slightly {s}', radar: 'Radar showing the estimated direction of the loudest sound', switchLang: 'Deutsch',


  },
  de: {
    bearing: 'Richtung', side: 'Seite', level: 'Pegel dBFS', confidence: 'Sicherheit',
    listensTo: 'Was Sonar hört', distance: 'Entfernung', near: 'nah', mid: 'mittel', far2: 'fern',
    radarNote: 'Ein Stereosignal zeigt nur links und rechts: Vorne und hinten klingen darin gleich, und Höhe kennt es nicht. Die Entfernung ist eine Schätzung aus Pegel und Raumhall; kalibriere sie für diesen Raum.',
    grpIn: 'Eingänge des Pults', grpOut: 'Ausgänge des Mixers', grpOther: 'Weiteres Audio',
    sMic12: 'Mic 1 + Mic 2', sMic23: 'Mic 2 + Mic 3', sIn34: 'Eingänge 3 + 4', sUsb1: 'USB 1 vom Computer', sUsb2: 'USB 2 vom Computer', sChat: 'Chat',
    sCall: 'Anruf {n}', sWireless: 'RØDE Wireless', sToUsb1: 'Mix zum Computer (USB 1)', sToChat: 'Chat zum Computer', sToUsb2: 'USB 2 zum Computer',
    sMixOut: 'Mixer-Ausgang {a} + {b}', sTest: 'Testsignal (wandert links ↔ rechts)',
    noteMono: '„{ch}“ ist ein einzelnes Mikrofon und hat keine Richtung: Sonar hört {src}.',
    noteUnknown: 'Wo „{ch}“ ankommt, kennt Sonar nicht: Wähle oben, was es hören soll.',
    noteTaps: 'Das Audio des Pults kommt über die Audio-Abgriffe von rcplug zu Sonar, und die sind ausgeschaltet.', tapsLink: 'Einschalten',
    calTitle: 'Entfernung kalibrieren', calHint: 'Ein paar Sekunden nah an den Mikrofonen sprechen oder klatschen und „Nah“ drücken, dann vom anderen Ende des Raums und „Fern“.',
    calNear: 'Nah', calFar: 'Fern', calReset: 'Zurücksetzen', calNone: 'Nicht kalibriert: eine grobe Schätzung.', calOnlyNear: 'Nah ist gesetzt, jetzt Fern.', calOnlyFar: 'Fern ist gesetzt, jetzt Nah.',
    calDone: 'Kalibriert (nah {n} dBFS, fern {f} dBFS).', calSame: 'Nah war nicht lauter als fern: bitte neu kalibrieren.', noSignal: 'In den letzten Sekunden war nichts zu hören: beim Kalibrieren sprechen oder klatschen.',
    settings: 'Einstellungen', refresh: 'Quellenliste neu laden', smoothing: 'Glättung', noise: 'Rauschschwelle', flip: 'Links/Rechts tauschen',
    connecting: 'verbinde…', reconnecting: 'verbinde neu…', live: 'live', noData: 'keine Daten', failed: 'Einstellung nicht übernommen: {err}',
    centre: 'MITTE', far: 'GANZ {s}', slight: 'leicht {s}', radar: 'Radar mit der geschätzten Richtung des lautesten Geräuschs', switchLang: 'English',


  },
};
let lang = 'en';
try { lang = localStorage.getItem('rcplug-lang') || ((navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en'); } catch (e) { /* ignore */ }
if (!T[lang]) lang = 'en';
document.documentElement.lang = lang;
const t = (k, p) => (T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (m, n) => (p && n in p ? p[n] : m));
const $ = (s) => document.querySelector(s);
const embedded = window.self !== window.top;
if (embedded) document.body.classList.add('embedded');
document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
document.querySelectorAll('[data-t-title]').forEach((el) => { el.title = t(el.dataset.tTitle); el.setAttribute('aria-label', el.title); });
$('#cv').setAttribute('aria-label', t('radar'));
$('#state').textContent = t('connecting');
$('#lang').textContent = t('switchLang');
$('#lang').addEventListener('click', () => {
  try { localStorage.setItem('rcplug-lang', lang === 'de' ? 'en' : 'de'); } catch (e) { /* ignore */ }
  location.reload();
});
const showErr = (msg) => { $('#err').textContent = msg || ''; $('#err').hidden = !msg; };

// ---- radar
const cv = $('#cv'), ctx = cv.getContext('2d');
const css = getComputedStyle(document.documentElement);
const C = { line: css.getPropertyValue('--line').trim(), muted: css.getPropertyValue('--dim').trim(), accent: '25,195,125' };
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

const TRAIL_MS = 2000, TRAIL_MAX = 120;
// state is the latest reading; view follows it smoothly between readings,
// which come about 30 times a second.
const state = { az: 0, level: 0, conf: 0, dist: 0.5 };
const view = { az: 0, level: 0, conf: 0, dist: 0.5 };
const FOLLOW_MS = { az: 140, level: 90, conf: 200, dist: 400 };
// Near the centre is near the microphones, the outer ring far away.
const radiusOf = (dist) => 0.12 + 0.83 * Math.max(0, Math.min(1, dist));
const trail = [];
let lastFrame = performance.now(), lastData = 0, lastText = 0;
const angleOf = (az) => Math.PI + (az + 90) / 180 * Math.PI;

function draw(now) {
  const dt = Math.min(100, now - lastFrame); lastFrame = now;
  for (const k in view) view[k] += (state[k] - view[k]) * (1 - Math.exp(-dt / FOLLOW_MS[k]));
  if (now - lastText > 200) { lastText = now; showReadouts(); }
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.95, R = Math.min(W / 2 - 14, H * 0.88);
  ctx.strokeStyle = C.line; ctx.lineWidth = 1;
  for (let k = 1; k <= 4; k++) { ctx.beginPath(); ctx.arc(cx, cy, R * k / 4, Math.PI, 2 * Math.PI); ctx.stroke(); }
  ctx.fillStyle = C.muted; ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'center';
  for (const a of [-90, -45, 0, 45, 90]) {
    const ang = angleOf(a), x = cx + Math.cos(ang) * R, y = cy + Math.sin(ang) * R;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
    const lx = cx + Math.cos(ang) * (R + 4) + (a === -90 ? 14 : a === 90 ? -14 : 0), ly = cy + Math.sin(ang) * (R + 8) - (Math.abs(a) === 90 ? 6 : 0);
    ctx.fillText((a > 0 ? '+' : '') + a + '°', lx, ly);
  }
  ctx.textAlign = 'left';
  ctx.fillText(t('near'), cx + R * 0.14, cy - 4);
  ctx.fillText(t('far2'), cx + R * 0.72, cy - 4);
  ctx.textAlign = 'center';
  pruneTrail(now);
  for (const p of trail) {
    const age = (now - p.at) / TRAIL_MS, ang = angleOf(p.az), rr = R * radiusOf(p.dist);
    ctx.fillStyle = `rgba(${C.accent},${(1 - age) * 0.5 * p.level})`;
    ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr, 3, 0, 2 * Math.PI); ctx.fill();
  }
  const ang = angleOf(view.az), rr = R * radiusOf(view.dist);
  const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr, size = 5 + view.level * 14;
  const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 2.2);
  glow.addColorStop(0, `rgba(231,237,243,${0.55 + 0.4 * view.conf})`);
  glow.addColorStop(0.4, `rgba(${C.accent},${0.45 * view.level + 0.2})`);
  glow.addColorStop(1, `rgba(${C.accent},0)`);
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, size * 2.2, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#e7edf3'; ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = `rgba(${C.accent},${0.3 + 0.5 * view.conf})`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R); ctx.stroke();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function pruneTrail(now) {
  let drop = 0;
  while (drop < trail.length && now - trail[drop].at > TRAIL_MS) drop++;
  if (trail.length - drop > TRAIL_MAX) drop = trail.length - TRAIL_MAX;
  if (drop) trail.splice(0, drop);
}

function dirName(az) {
  if (Math.abs(az) < 6) return t('centre');
  const s = az < 0 ? 'L' : 'R', m = Math.abs(az);
  if (m > 60) return t('far', { s });
  return m > 25 ? s : t('slight', { s });
}

// The numbers change five times a second: often enough to follow, slow
// enough to read.
let levelDb = -120;
function showReadouts() {
  $('#distV').textContent = view.level > 0.04 ? t(view.dist < 0.34 ? 'near' : view.dist < 0.67 ? 'mid' : 'far2') : '—';
  $('#azV').textContent = (view.az > 0.5 ? '+' : '') + view.az.toFixed(0) + '°';
  $('#dirV').textContent = dirName(view.az);
  $('#lvlV').textContent = levelDb <= -99 ? '-∞' : levelDb.toFixed(0);
  $('#confV').textContent = (view.conf * 100).toFixed(0) + '%';
}
let srcErr = '';
function onData(d) {
  lastData = performance.now();
  $('#scope').classList.remove('stale');
  state.az = d.az; state.level = d.level; state.conf = d.conf; state.dist = d.dist ?? 0.5;
  levelDb = d.levelDb;
  if (d.level > 0.04) { trail.push({ az: view.az, level: view.level, dist: view.dist, at: lastData }); pruneTrail(lastData); }
  $('#mL').style.transform = `scaleX(${Math.max(0, Math.min(1, d.l))})`;
  $('#mR').style.transform = `scaleX(${Math.max(0, Math.min(1, d.r))})`;
  const tapsOff = !!d.err && /audio taps/.test(d.err);
  $('#state').textContent = tapsOff ? t('noData') : d.err ? d.err : t('live');
  $('#state').classList.toggle('on', !d.err);
  if ((d.err || '') !== srcErr) { srcErr = d.err || ''; renderListen(); }
}

// ---- live stream: reopened with backoff when it closes
let es = null, retry = 1000;
function connect() {
  es = new EventSource('stream');
  es.onopen = () => { retry = 1000; };
  es.onmessage = (e) => { try { onData(JSON.parse(e.data)); } catch (x) { /* ignore a bad frame */ } };
  es.onerror = () => {
    $('#state').textContent = t('reconnecting'); $('#state').classList.remove('on');
    if (es.readyState === EventSource.CLOSED) { es.close(); setTimeout(connect, retry); retry = Math.min(retry * 2, 10000); }
  };
}
connect();
setInterval(() => {
  if (performance.now() - lastData > 3000) {
    $('#scope').classList.add('stale');
    state.level = 0; state.conf = 0;
    if (es && es.readyState === EventSource.OPEN) { $('#state').textContent = t('noData'); $('#state').classList.remove('on'); }
  }
}, 1000);

// ---- config and what Sonar hears
let cfg = {}, sources = { jack: [], alsa: [], builtin: [] };
async function api(path, body) {
  const opt = body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Rcplug': '1' }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  let d = null;
  try { d = await r.json(); } catch (e) { /* not JSON */ }
  if (!r.ok) { const e = new Error((d && d.error) || 'HTTP ' + r.status); e.code = d && d.code; throw e; }
  return d;
}
async function patch(p) {
  try { cfg = await api('api/config', p); showErr(''); renderConfig(); }
  catch (e) { showErr(e.code === 'no_signal' ? t('noSignal') : t('failed', { err: e.message })); loadConfig(); }
}

// The desk's audio as a Duo with firmware 1.7.6 wires it in JACK (rcplug's
// docs/device-notes.md, "The JACK graph"), by name. Pairs not listed here
// show under their technical names.
const NAMED = {
  'system:capture_1,system:capture_2': ['in', () => t('sMic12')],
  'system:capture_2,system:capture_3': ['in', () => t('sMic23')],
  'system:capture_3,system:capture_4': ['in', () => t('sIn34')],
  'usb1in:capture_1,usb1in:capture_2': ['in', () => t('sUsb1')],
  'usb2in:capture_1,usb2in:capture_2': ['in', () => t('sUsb2')],
  'usb1-chat-in:capture_1,usb1-chat-in:capture_2': ['in', () => t('sChat')],
  'sip-audio-in:capture_1,sip-audio-in:capture_2': ['in', () => t('sCall', { n: 1 })],
  'sip-audio-in:capture_3,sip-audio-in:capture_4': ['in', () => t('sCall', { n: 2 })],
  'sip-audio-in:capture_5,sip-audio-in:capture_6': ['in', () => t('sCall', { n: 3 })],
  'RodeRfSPI:TX1,RodeRfSPI:TX2': ['in', () => t('sWireless')],
  'JUCEJack:out_15,JUCEJack:out_16': ['out', () => t('sToUsb1')],
  'JUCEJack:out_17,JUCEJack:out_18': ['out', () => t('sToChat')],
  'JUCEJack:out_19,JUCEJack:out_20': ['out', () => t('sToUsb2')],
};
// Where a channel of the desk comes in (the console names its source).
const FROM_DESK = {
  combo1: 'system:capture_1,system:capture_2', combo2: 'system:capture_1,system:capture_2', combo1_2: 'system:capture_1,system:capture_2',
  combo2_3: 'system:capture_2,system:capture_3',
  combo3: 'system:capture_3,system:capture_4', combo4: 'system:capture_3,system:capture_4', combo3_4: 'system:capture_3,system:capture_4',
  usb1: 'usb1in:capture_1,usb1in:capture_2', usb2: 'usb2in:capture_1,usb2in:capture_2', chat: 'usb1-chat-in:capture_1,usb1-chat-in:capture_2',
  callme1: 'sip-audio-in:capture_1,sip-audio-in:capture_2', callme2: 'sip-audio-in:capture_3,sip-audio-in:capture_4',
  callme3: 'sip-audio-in:capture_5,sip-audio-in:capture_6',
};
// One microphone has no direction; Sonar takes the pair it is part of.
const MONO = /^combo[1-4]$/;

// describe names an audio source and puts it into a group.
function describe(src) {
  if (src === 'test') return ['other', t('sTest')];
  if (src.startsWith('jack:')) {
    const pair = src.slice(5), named = NAMED[pair];
    if (named) return [named[0], named[1]()];
    const out = /^JUCEJack:out_(\d+),JUCEJack:out_(\d+)$/.exec(pair);
    if (out) return ['out', t('sMixOut', { a: out[1], b: out[2] })];
    return ['other', pair.replace(',', ' + ')];
  }
  if (src.startsWith('alsa:')) return ['other', 'ALSA ' + src.slice(5)];
  return ['other', src];
}
const technical = (src) => (src.startsWith('jack:') ? 'JACK ' + src.slice(5).replace(',', ' + ') : '');

function renderListen() {
  const all = [...(sources.jack || []).map((p) => 'jack:' + p), ...(sources.alsa || []).map((d) => 'alsa:' + d), ...(sources.builtin || [])];
  if (cfg.source && !all.includes(cfg.source)) all.push(cfg.source);
  const groups = { in: [], out: [], other: [] };
  for (const src of all) { const [g, name] = describe(src); groups[g].push([src, name]); }
  const sel = $('#listen');
  sel.textContent = '';
  for (const [g, key] of [['in', 'grpIn'], ['out', 'grpOut'], ['other', 'grpOther']]) {
    if (!groups[g].length) continue;
    const og = document.createElement('optgroup');
    og.label = t(key);
    // Inputs in the order of the table above, outputs by number.
    const order = Object.keys(NAMED);
    const rank = (v) => (v === 'test' ? -1 : order.indexOf(v.slice(5)) + 1 || 999);
    groups[g].sort((a, b) => rank(a[0]) - rank(b[0]) || a[1].localeCompare(b[1], undefined, { numeric: true }));
    for (const [v, name] of groups[g]) { const o = document.createElement('option'); o.value = v; o.textContent = name; o.selected = v === cfg.source; og.appendChild(o); }
    sel.appendChild(og);
  }
  $('#listenInfo').textContent = technical(cfg.source || '');
  const note = $('#listenNote');
  note.textContent = '';
  if (/audio taps/.test(srcErr)) {
    const a = document.createElement('a');
    a.href = '/#/system'; a.target = '_top'; a.textContent = t('tapsLink');
    note.append(t('noteTaps') + ' ', a);
  } else if (deskNote) note.textContent = deskNote;
  note.hidden = !note.textContent;
  $('#subline').textContent = cfg.source ? describe(cfg.source)[1] : '';
}
function renderConfig() {
  renderListen();
  $('#smoothing').value = cfg.smoothing; $('#smoothingV').textContent = (+cfg.smoothing).toFixed(2);
  $('#noise').value = cfg.noiseFloor; $('#noiseV').textContent = cfg.noiseFloor + ' dB';
  for (const id of ['smoothing', 'noise']) { const el = $('#' + id); el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }
  $('#flip').checked = !!cfg.flip;
  const c = cfg.calibration || {};
  $('#calState').textContent = c.calibrated ? t('calDone', { n: c.near.db.toFixed(0), f: c.far.db.toFixed(0) })
    : c.near && c.far ? t('calSame') : c.near ? t('calOnlyNear') : c.far ? t('calOnlyFar') : t('calNone');
  $('#calReset').hidden = !c.near && !c.far;
}
let deskNote = '';
async function loadSources() {
  try { sources = await api('api/sources'); }
  catch (e) { showErr(t('failed', { err: e.message })); }
}
async function loadConfig() {
  try { cfg = await api('api/config'); renderConfig(); } catch (e) { /* the stream shows the state */ }
}
const timers = {};
function patchSoon(k, p) { clearTimeout(timers[k]); timers[k] = setTimeout(() => patch(p), 150); }
$('#listen').addEventListener('change', (e) => { deskNote = ''; trail.length = 0; patch({ source: e.target.value }); });
$('#refreshSrc').addEventListener('click', async () => { await loadSources(); renderListen(); });
$('#calNear').addEventListener('click', () => patch({ calibrate: 'near' }));
$('#calFar').addEventListener('click', () => patch({ calibrate: 'far' }));
$('#calReset').addEventListener('click', () => patch({ calibrate: 'reset' }));
$('#smoothing').addEventListener('input', (e) => { $('#smoothingV').textContent = (+e.target.value).toFixed(2); e.target.style.setProperty('--p', (e.target.value / 0.95 * 100) + '%'); patchSoon('s', { smoothing: +e.target.value }); });
$('#noise').addEventListener('input', (e) => { $('#noiseV').textContent = e.target.value + ' dB'; e.target.style.setProperty('--p', ((e.target.value - -80) / 60 * 100) + '%'); patchSoon('n', { noiseFloor: +e.target.value }); });
$('#flip').addEventListener('change', (e) => patch({ flip: e.target.checked }));

(async () => {
  await loadSources();
  await loadConfig();
  // Opened from a channel of the console: ?strip=…&source=combo1&label=….
  // Sonar listens to where that channel comes in, right away.
  const q = new URLSearchParams(location.search);
  const ch = q.get('source') || '', mic = /^combo(\d)$/.exec(ch);
  const label = mic ? 'Mic ' + mic[1] : q.get('label') || ch;
  if (!ch) return;
  const pair = FROM_DESK[ch];
  if (!pair) { deskNote = t('noteUnknown', { ch: label }); renderListen(); return; }
  if (MONO.test(ch)) deskNote = t('noteMono', { ch: label, src: describe('jack:' + pair)[1] });
  if (cfg.source !== 'jack:' + pair) { trail.length = 0; await patch({ source: 'jack:' + pair, channel: /^[a-z][a-z0-9_-]{0,31}$/.test(ch) ? ch : '' }); }
  else renderListen();
})();
</script>
</body>
</html>
